name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend containers
        run: |
          mkdir -p backend
          echo "DB_NAME=blog_db" > backend/.env
          echo "DB_USER=blog_user" >> backend/.env
          echo "DB_PASSWORD=1234567890" >> backend/.env
          echo "DB_HOST=db" >> backend/.env
          echo "DB_PORT=5432" >> backend/.env
          echo "SECRET_KEY=test-secret-key" >> backend/.env
          docker-compose build backend

      - name: Run migrations
        run: |
          sleep 10
          docker-compose run backend python manage.py migrate

      - name: Run backend tests
        run: docker-compose run backend python manage.py test
